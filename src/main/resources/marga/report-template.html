                { selector: 'edge.hl[type="classEdge"]', style: { 'line-color': EDGE.direct, 'target-arrow-color': EDGE.direct, 'underlay-color': EDGE.direct } },
                { selector: 'node[type="method"].focus', style: {
                        'width': 16, 'height': 16, 'background-color': '#10b981', 'border-width': 3, 'border-color': '#d1fae5',
                        'underlay-color': '#10b981', 'underlay-opacity': 0.4, 'underlay-padding': 8, 'underlay-shape': 'ellipse', 'font-size': 12, 'font-weight': 700, 'color': '#f8fafc' }},
                { selector: 'node[type="class"].focus', style: { 'border-width': 3, 'border-opacity': 1 } },
                { selector: '.dim-trace', style: { 'opacity': 0.12 } }
            ]
        });

        // flowing dashes on highlighted edges + a breathing beacon on the focused method
        let animating = false;
        function startAnimation() {
            if (animating) return;
            animating = true;
            let offset = 0, t0 = performance.now();
            const tick = now => {
                const edges = cy.edges('.hl');
                const focus = cy.nodes('node[type="method"].focus');
                if (!edges.length && !focus.length) { animating = false; return; }
                offset = (offset - 0.6) % 1000;
                if (edges.length <= 800) edges.style('line-dash-offset', offset);
                const pulse = 6 + 5 * (0.5 + 0.5 * Math.sin((now - t0) / 380));
                focus.style('underlay-padding', pulse);
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }

        /** Elements for a set of methods: class spheres, methods, calls among them, hierarchy, class-level edges. */
        function buildElements(methodIds) {
            const inSet = new Set(methodIds);
            const classes = new Set(methodIds.map(classOf));
            const elements = [];
            classes.forEach(c => {
                const s = stereo(c);
                elements.push({ group: 'nodes', data: {
                        id: 'c' + c, type: 'class', cls: c, mod: G.classModule[c], label: G.classNames[c], state: beanState(c),
                        color: s.color, core: s.core, stereo: stereotypeOf(c), size: 60 } });
            });
            methodIds.forEach(m => elements.push({ group: 'nodes', data: {
                    id: 'm' + m, type: 'method', mid: m, cls: classOf(m), label: methodLabel(m), entry: isEntry(m),
                    changed: !!(G.impact && G.impact.changedSet.has(m)) } }));
            // module circles, only when the drawn classes span more than one Maven module
            const moduleCounts = new Map();
            classes.forEach(c => moduleCounts.set(G.classModule[c], (moduleCounts.get(G.classModule[c]) || 0) + 1));
            if (moduleCounts.size > 1) {
                moduleCounts.forEach((count, mod) => elements.push({ group: 'nodes', data: {
                        id: 'M' + mod, type: 'module', mod, size: 200, color: MODULE_COLORS[mod % MODULE_COLORS.length],
                        label: `${G.modules[mod] || 'module ' + mod}  ·  ${plural(count, 'class', 'classes')}` } }));
            }
            const classEdges = new Map();
            methodIds.forEach(m => {
                for (let e = G.revOffsets[m]; e < G.revOffsets[m + 1]; e++) {
                    const caller = G.revSources[e];
                    if (!inSet.has(caller)) continue;
                    elements.push({ group: 'edges', data: { id: 'e' + e, source: 'm' + caller, target: 'm' + m, kind: G.revKinds[e] } });
                    const a = classOf(caller), b = classOf(m);
                    if (a !== b) classEdges.set(a + '_' + b, (classEdges.get(a + '_' + b) || 0) + 1);
                }
                for (let e = G.ovrOffsets[m]; e < G.ovrOffsets[m + 1]; e++) {
                    const declaration = G.ovrTargets[e];
                    if (inSet.has(declaration)) elements.push({ group: 'edges', data: {
                            id: 'h' + e, source: 'm' + m, target: 'm' + declaration, hier: true } });
                }
            });
            classEdges.forEach((count, key) => {
                const [a, b] = key.split('_');
                elements.push({ group: 'edges', data: { id: 'k' + key, type: 'classEdge', source: 'c' + a, target: 'c' + b,
                        width: Math.min(6, 0.8 + Math.log2(count + 1)) } });
            });
            return elements;
        }

        // ---------- constellation layout: methods on a sunflower spiral inside their class sphere,
        //            spheres placed with a force layout on the class-level graph
        const SPACING = 28, PAD = 26, GAP = 40, GOLDEN = Math.PI * (3 - Math.sqrt(5));

        function removeOverlaps(circles, gap, maxIter) {
            for (let it = 0; it < maxIter; it++) {
                let moved = false;
                circles.sort((a, b) => (a.x - a.r) - (b.x - b.r));
                for (let i = 0; i < circles.length; i++) {
                    const a = circles[i];
                    for (let j = i + 1; j < circles.length; j++) {
                        const b = circles[j];
                        if (b.x - b.r > a.x + a.r + gap) break;
                        const dx = b.x - a.x, dy = b.y - a.y;
                        const dist = Math.hypot(dx, dy) || 0.01;
                        const overlap = a.r + b.r + gap - dist;
                        if (overlap <= 0) continue;
                        moved = true;
                        const ux = dx / dist, uy = dy / dist;
                        a.x -= ux * overlap / 2; a.y -= uy * overlap / 2;
                        b.x += ux * overlap / 2; b.y += uy * overlap / 2;
                    }
                }
                if (!moved) return;
            }
        }

        const methodOrder = (a, b) =>
            (b.data('entry') - a.data('entry')) || (b.data('changed') - a.data('changed')) || a.data('label').localeCompare(b.data('label'));

        const MODULE_PAD = 70, MODULE_GAP = 140;
        const MODULE_COLORS = ['#38bdf8', '#a78bfa', '#34d399', '#f472b6', '#fbbf24', '#fb7185', '#22d3ee', '#c084fc'];

        /** Force layout of circles (id, r) linked by edges, then overlap removal. Resolves to [{id, x, y, r}]. */
        function coseCircles(items, edges, opts) {
            const radius = new Map(items.map(i => [i.id, i.r]));
            // an invisible hub linked to every item keeps unconnected items clustered around one centre
            // instead of being packed in rows as separate components
            const hub = opts.hub ? [{ group: 'nodes', data: { id: '__hub', d: 1 } },
                ...items.map((i, k) => ({ group: 'edges', data: { id: 'hub' + k, source: '__hub', target: i.id } }))] : [];
            const helper = cytoscape({
                headless: true, styleEnabled: true,
                elements: [
                    ...items.map(i => ({ group: 'nodes', data: { id: i.id, d: i.r * 2 } })),
                    ...edges.map(([a, b], k) => ({ group: 'edges', data: { id: 'h' + k, source: a, target: b } })),
                    ...hub
                ],
                style: [{ selector: 'node', style: { width: 'data(d)', height: 'data(d)' } }]
            });
            return new Promise(resolve => {
                const layout = helper.layout({
                    name: 'cose', animate: false, randomize: true, nodeOverlap: 40,
                    nodeRepulsion: () => opts.repulsion, idealEdgeLength: () => opts.edge,
                    componentSpacing: opts.spacing, gravity: 1, numIter: 1500
                });
                layout.one('layoutstop', () => {
                    const out = helper.nodes().filter(n => n.id() !== '__hub')
                        .map(n => ({ id: n.id(), x: n.position('x'), y: n.position('y'), r: radius.get(n.id()) }));
                    helper.destroy();
                    removeOverlaps(out, opts.gap, 800);
                    resolve(out);
                });
                layout.run();
            });
        }

        /**
         * Classes are laid out inside their Maven module first; modules are then placed by the calls
         * between them, and every class is shifted into its module's circle.
         */
        async function layoutGraph() {
            const classes = cy.nodes('[type="class"]');
            const members = new Map();
            cy.nodes('[type="method"]').forEach(n => {
                const key = 'c' + n.data('cls');
                if (!members.has(key)) members.set(key, []);
                members.get(key).push(n);
            });
            const radius = new Map();
            classes.forEach(c => {
                const n = (members.get(c.id()) || []).length;
                radius.set(c.id(), Math.max(34, SPACING * Math.sqrt(n) * 0.75 + PAD));
            });
            const classEdges = cy.edges('[type="classEdge"]').map(e => [e.source().id(), e.target().id()]);
            const classOpts = { repulsion: 400000, edge: 110, spacing: 140, gap: GAP };
            const modules = cy.nodes('[type="module"]');
            let circles;

            if (modules.length < 2) {
                circles = await coseCircles(classes.map(c => ({ id: c.id(), r: radius.get(c.id()) })), classEdges, classOpts);
            } else {
                const moduleOf = new Map(classes.map(c => [c.id(), 'M' + c.data('mod')]));
                const byModule = new Map();
                classes.forEach(c => {
                    const mid = moduleOf.get(c.id());
                    if (!byModule.has(mid)) byModule.set(mid, []);
                    byModule.get(mid).push(c.id());
                });
                const inner = new Map();
                for (const [mid, ids] of byModule) {
                    const set = new Set(ids);
                    const local = await coseCircles(ids.map(id => ({ id, r: radius.get(id) })),
                        classEdges.filter(([a, b]) => set.has(a) && set.has(b)), { ...classOpts, hub: true, edge: 70, gap: 30 });
                    const cx = local.reduce((s, c) => s + c.x, 0) / local.length;
                    const cyy = local.reduce((s, c) => s + c.y, 0) / local.length;
                    const R = local.reduce((mx, c) => Math.max(mx, Math.hypot(c.x - cx, c.y - cyy) + c.r), 0) + MODULE_PAD;
                    inner.set(mid, { local, cx, cy: cyy, R });
                }
                const moduleEdges = new Set();
                classEdges.forEach(([a, b]) => {
                    const ma = moduleOf.get(a), mb = moduleOf.get(b);
                    if (ma !== mb) moduleEdges.add(ma < mb ? ma + '|' + mb : mb + '|' + ma);
                });
                const placed = await coseCircles([...inner].map(([id, v]) => ({ id, r: v.R })),
                    [...moduleEdges].map(k => k.split('|')),
                    { repulsion: 200000, edge: 60, spacing: 120, gap: MODULE_GAP, hub: true });
                circles = [];
                cy.batch(() => placed.forEach(p => {
                    const v = inner.get(p.id);
                    cy.getElementById(p.id).position({ x: p.x, y: p.y }).data('size', v.R * 2);
                    v.local.forEach(c => circles.push({ id: c.id, x: p.x + c.x - v.cx, y: p.y + c.y - v.cy, r: c.r }));
                }));
            }

            cy.batch(() => circles.forEach(c => {
                const node = cy.getElementById(c.id);
                node.position({ x: c.x, y: c.y });
                node.data('size', c.r * 2);
                const list = (members.get(c.id) || []).sort(methodOrder);
                list.forEach((m, i) => {
                    const r = SPACING * 0.75 * Math.sqrt(i + (list.length > 1 ? 0.5 : 0));
                    m.position({ x: c.x + r * Math.cos(i * GOLDEN), y: c.y + r * Math.sin(i * GOLDEN) });
                });
            }));
        }

        // modules carry their classes and methods when dragged
        let moduleDrag = null;
        cy.on('grab', 'node[type="module"]', e => { moduleDrag = { ...e.target.position() }; });
        cy.on('drag', 'node[type="module"]', e => {
            if (!moduleDrag) return;
            const p = e.target.position(), dx = p.x - moduleDrag.x, dy = p.y - moduleDrag.y;
            moduleDrag = { ...p };
            const mod = e.target.data('mod');
            cy.batch(() => cy.nodes(`[type="class"][mod = ${mod}]`).forEach(c => {
                const q = c.position(); c.position({ x: q.x + dx, y: q.y + dy });
                cy.nodes(`[type="method"][cls = ${c.data('cls')}]`).forEach(m => {
                    const r = m.position(); m.position({ x: r.x + dx, y: r.y + dy });
                });
            }));
        });
        cy.on('free', 'node[type="module"]', () => { moduleDrag = null; });

        // spheres carry their methods when dragged
        let dragFrom = null;
        cy.on('grab', 'node[type="class"]', e => { dragFrom = { ...e.target.position() }; });
        cy.on('drag', 'node[type="class"]', e => {
            if (!dragFrom) return;
            const p = e.target.position(), dx = p.x - dragFrom.x, dy = p.y - dragFrom.y;
            dragFrom = { ...p };
            cy.nodes(`[type="method"][cls = ${e.target.data('cls')}]`).forEach(m => {
                const q = m.position(); m.position({ x: q.x + dx, y: q.y + dy });
            });
        });
        cy.on('free', 'node[type="class"]', () => { dragFrom = null; });

        async function draw(methodIds) {
            await ensureSignatures(methodIds);
            cy.elements().remove();
            cy.add(buildElements(methodIds));
            applyLod();
            await layoutGraph();
            fitVisible(cy.elements(), false, 40);
        }

        // ---------- level of detail
        let lod = 'methods';
        function applyLod() {
            cy.batch(() => {
                const methodLevel = cy.nodes('[type="method"]').union(cy.edges('[type!="classEdge"]'));
                const classLevel = cy.edges('[type="classEdge"]');
                if (lod === 'methods') { methodLevel.removeClass('lod-off'); classLevel.addClass('lod-off'); }
                else { methodLevel.addClass('lod-off'); classLevel.removeClass('lod-off'); }
            });
            $('lod-methods').classList.toggle('on', lod === 'methods');
            $('lod-classes').classList.toggle('on', lod === 'classes');
        }
        $('lod-methods').addEventListener('click', () => { lod = 'methods'; applyLod(); });
        $('lod-classes').addEventListener('click', () => { lod = 'classes'; applyLod(); });

        /** Fits elements into the part of the canvas not covered by the top bar and the inspector. */
        function fitVisible(eles, withDrawer, padding = 70) {
            if (!eles || eles.empty()) return;
            const bb = eles.boundingBox();
            const rect = cy.container().getBoundingClientRect();
            const wide = window.innerWidth > 1300;
            const left = 20, right = withDrawer ? (wide ? 560 : 20) : 20, top = wide ? 96 : 170, bottom = 20;
            const w = Math.max(100, rect.width - left - right - 2 * padding);
            const h = Math.max(100, rect.height - top - bottom - 2 * padding);
            const zoom = Math.max(cy.minZoom(), Math.min(1.8, w / Math.max(bb.w, 1), h / Math.max(bb.h, 1)));
            const pan = {
                x: left + padding + w / 2 - zoom * (bb.x1 + bb.w / 2),
                y: top + padding + h / 2 - zoom * (bb.y1 + bb.h / 2)
            };
            cy.animate({ zoom, pan, duration: 450, easing: 'ease-out-cubic' });
        }

        function highlight(methodIds, focusIds, fitIds = methodIds) {
            const nodes = cy.collection(methodIds.map(m => cy.getElementById('m' + m)));
            const edges = nodes.edgesWith(nodes);
            const spheres = cy.collection([...new Set(methodIds.map(m => 'c' + classOf(m)))].map(id => cy.getElementById(id)));
            const classEdges = spheres.edgesWith(spheres).filter('[type="classEdge"]');
            const lit = nodes.union(edges).union(spheres).union(classEdges);
            cy.batch(() => {
                cy.elements().removeClass('hl focus dim-trace').addClass('faded');
                lit.removeClass('faded').addClass('hl');
                const litModules = new Set(methodIds.map(m => G.classModule[classOf(m)]));
                cy.nodes('[type="module"]').forEach(n => { n.removeClass('faded'); if (litModules.has(n.data('mod'))) n.addClass('hl'); });
                focusIds.forEach(m => cy.getElementById('m' + m).addClass('focus'));
            });
            const fitNodes = cy.collection(fitIds.map(m => cy.getElementById('m' + m)));
            fitVisible(fitNodes.union(cy.collection([...new Set(fitIds.map(m => 'c' + classOf(m)))].map(id => cy.getElementById(id)))), true);
            startAnimation();
        }

        /** Emphasise one trace (entry -> ... -> target) inside the current highlight. */
        function emphasiseTrace(path) {
            const nodes = cy.collection(path.map(m => cy.getElementById('m' + m)));
            const spheres = cy.collection([...new Set(path.map(m => 'c' + classOf(m)))].map(id => cy.getElementById(id)));
            const keep = nodes.union(nodes.edgesWith(nodes)).union(spheres).union(spheres.edgesWith(spheres).filter('[type="classEdge"]'));
            cy.batch(() => {
                cy.elements('.hl').difference(keep).addClass('dim-trace');
                keep.removeClass('dim-trace');
            });
            fitVisible(keep, true, 110);
        }

        // ---------- tooltip on hover
        const tip = $('tip');
        cy.on('mouseover', 'node', e => {
            const n = e.target;
            tip.replaceChildren();
            if (n.data('type') === 'module') {
                tip.append(el('div', null, n.data('label')), el('div', 'where', 'Maven module · drag to move, click to zoom'));
            } else if (n.data('type') === 'method') {
                const m = n.data('mid');
                tip.append(el('div', null, methodLabel(m)), el('div', 'where', classFqn(classOf(m))));
            } else {
                const c = n.data('cls');
                tip.append(el('div', null, `${G.classNames[c]} · ${classMethods(c).length} methods`), el('div', 'where', classFqn(c)));
            }
            tip.hidden = false;
        });
        cy.on('mousemove', e => { tip.style.left = (e.originalEvent.clientX + 14) + 'px'; tip.style.top = (e.originalEvent.clientY + 14) + 'px'; });
        cy.on('mouseout', 'node', () => { tip.hidden = true; });

        // ================================================================ views
        let fullMode = false;
        let lastSelection = null;

        // ---------- deep links: #impact, #method=<id>, #class=<id>
        // Every view is reflected in the URL, so it can be shared and the browser's Back button works.
        let routing = false;
        function setRoute(route, replace) {
            if (routing) return;
            const url = route ? '#' + route : location.pathname + location.search;
            if ((route ? '#' + route : '') === location.hash) return;
            history[replace ? 'replaceState' : 'pushState'](null, '', url);
        }
        async function applyRoute() {
            const hash = decodeURIComponent(location.hash.slice(1));
            routing = true;
            try {
                if (hash === 'impact' && G.impact) await showImpact();
                else if (hash.startsWith('method=') && +hash.slice(7) >= 0 && +hash.slice(7) < G.M) await selectMethods([+hash.slice(7)]);
                else if (hash.startsWith('class=') && +hash.slice(6) >= 0 && +hash.slice(6) < G.C) await selectClass(+hash.slice(6));
                else reset();
            } finally {
                routing = false;
            }
        }
        window.addEventListener('popstate', () => applyRoute());
        let copyText = '';

        async function present(drawnIds, focusIds, fitIds) {
            hideHint();
            if (!fullMode) {
                showHint('Laying out…', '');
                await draw(drawnIds);
                hideHint();
            }
            highlight(drawnIds, focusIds, fitIds || drawnIds);
        }

        function openDrawer(nodes, footNodes) {
            panel.replaceChildren(...nodes);
            foot.replaceChildren(...footNodes);
            panel.scrollTop = 0;
            drawer.classList.add('open');
        }
        function closeDrawer() { drawer.classList.remove('open'); }

        function drawerHead(chipText, chipColor, meta) {
            const head = el('div', 'drawer-head');
            const chip = el('span', 'chip', chipText);
            chip.style.color = chipColor;
            chip.style.borderColor = chipColor + '66';
            chip.style.background = chipColor + '14';
            const close = el('button', 'close', '×');
            close.type = 'button';
            close.title = 'Close (Esc)';
            close.addEventListener('click', reset);
            head.append(chip, el('span', 'head-meta', meta), close);
            return head;
        }

        function block(title, accent, ...content) {
            const s = el('section', 'block');
            const t = el('div', 'eyebrow', title);
            if (accent) t.appendChild(el('span', 'accent', accent));
            s.append(t, ...content);
            return s;
        }

        function stat(label, value, color) {
            const s = el('div', 'stat');
            const v = el('div', 'value', value);
            if (color) v.style.color = color;
            s.append(el('div', 'eyebrow', label), v);
            return s;
        }

        function stateTag(c) {
            const state = beanState(c);
            return el('span', 'tag ' + (state === 'active' ? 'ok' : state === 'inactive' ? 'off' : 'cond'),
                state === 'active' ? 'Active' : state === 'inactive' ? `Off · ${G.manifest.profiles.join(', ')}` : '@Conditional');
        }

        function traceCards(paths, rootsSet) {
            const wrap = el('div');
            paths.slice(0, MAX_TRACES).forEach((path, i) => {
                const entry = path[0], kind = entryKind(entry);
                const card = el('div', 'trace');
                const head = el('div', 'trace-head', `Route ${i + 1} · ${ENTRY_LABELS[kind]}`);
                head.style.color = ENTRY_COLORS[kind];
                head.appendChild(el('span', 'right', path.length === 1 ? 'is the target' : `${path.length - 1} hop${path.length === 2 ? '' : 's'}`));
                card.appendChild(head);
                path.forEach((m, depth) => {
                    const final = depth === path.length - 1 && rootsSet.has(m);
                    const hop = el('div', 'hop ' + (depth === 0 ? 'entry' : final ? 'final' : 'mid'));
                    hop.style.paddingLeft = final ? '' : (depth * 14) + 'px';
                    if (depth > 0 && !final) hop.appendChild(el('span', 'arrow', '↳ '));
                    hop.appendChild(document.createTextNode((final ? '✔ ' : '') + qualifiedLabel(m)));
                    if (depth > 0 && !final && G.revKinds) {
                        // show how this hop is reached from the previous method
                        const k = edgeKind(path[depth - 1], m);
                        if (k === 2) hop.appendChild(el('span', 'kind', 'may call'));
                        if (k === 1) hop.appendChild(el('span', 'kind', 'lambda'));
                    }
                    card.appendChild(hop);
                });
                card.addEventListener('click', () => {
                    wrap.querySelectorAll('.trace.active').forEach(t => t.classList.remove('active'));
                    card.classList.add('active');
                    emphasiseTrace(path);
                });
                wrap.appendChild(card);
            });
            if (paths.length > MAX_TRACES) wrap.appendChild(el('div', 'empty', `+ ${paths.length - MAX_TRACES} more entry points`));
            return wrap;
        }

        function edgeKind(caller, callee) {
            for (let e = G.revOffsets[callee]; e < G.revOffsets[callee + 1]; e++) if (G.revSources[e] === caller) return G.revKinds[e];
            return 0;
        }

        function stackText(title, paths) {
            const lines = [title];
            paths.forEach((path, i) => {
                lines.push('', `Route ${i + 1} · ${ENTRY_LABELS[entryKind(path[0])]}`);
                path.forEach((m, depth) => lines.push(`${'  '.repeat(depth)}${depth ? '↳ ' : ''}${qualifiedLabel(m)}  [${classFqn(classOf(m))}]`));
            });
            return lines.join('\n');
        }

        function edgeLegend() {
            const grid = el('div', 'legend-grid');
            [['Direct call', EDGE.direct, 'solid'], ['Lambda / method ref', EDGE.lambda, 'dashed'],
                ['May call (dispatch)', EDGE.dispatch, 'dotted'], ['Implements / overrides', EDGE.hier, 'solid']].forEach(([text, color, style]) => {
                const s = el('span');
                const stroke = el('i', 'stroke');
                stroke.style.borderTopColor = color;
                stroke.style.borderTopStyle = style;
                s.append(stroke, document.createTextNode(text));
                grid.appendChild(s);
            });
            return grid;
        }

        function copyButton() {
            const b = el('button', 'cta', '⧉  Copy full execution stack');
            b.type = 'button';
            b.addEventListener('click', async () => {
                try { await navigator.clipboard.writeText(copyText); }
                catch (e) {
                    const ta = el('textarea'); ta.value = copyText; document.body.appendChild(ta); ta.select();
                    document.execCommand('copy'); ta.remove();
                }
                b.textContent = '✔  Copied'; b.classList.add('done');
                setTimeout(() => { b.textContent = '⧉  Copy full execution stack'; b.classList.remove('done'); }, 1500);
            });
            return b;
        }

        function upstreamDetails(ids) {
            const d = el('details');
            d.appendChild(el('summary', null, `All upstream callers (${fmt(ids.length)})`));
            ids.slice(0, 300).forEach(m => {
                const h = el('div', 'hop', qualifiedLabel(m));
                h.addEventListener('click', () => selectMethods([m]));
                d.appendChild(h);
            });
            return d;
        }

        /**
         * Abstract / interface methods are expanded to their implementations; callers are traced
         * from the implementations (that is where the call edges point).
         */
        async function selectMethods(targets, classId) {
            closeResults();
            setView('explorer');
            lastSelection = [targets, classId];
            setRoute(classId !== undefined ? `class=${classId}` : `method=${targets[0]}`);
            const impls = [];
            const seen = new Set(targets);
            targets.filter(isAbstract).forEach(t => implementationsOf(t).forEach(m => {
                if (!seen.has(m)) { seen.add(m); impls.push(m); }
            }));
            const roots = [...targets, ...impls];
            const slice = callerSlice(roots, fullMode ? Infinity : SLICE_LIMIT);
            const drawn = new Set(slice.ids);
            roots.forEach(m => declarationsOf(m).forEach(d => { if (methodShown(d)) drawn.add(d); }));
            const drawnIds = [...drawn];

            await present(drawnIds, targets, slice.ids); // hierarchy context is drawn, but not zoomed to
            await ensureSignatures([...drawnIds.slice(0, 600), ...impls]);
            if (classId !== undefined) cy.getElementById('c' + classId).addClass('focus');

            const rootSet = new Set(roots);
            const paths = traces(slice);
            const upstream = slice.ids.filter(m => !rootSet.has(m));
            const c = classId !== undefined ? classId : classOf(targets[0]);
            const m = targets[0];
            const s = stereo(c);

            const nodes = [];
            nodes.push(drawerHead(`${stereotypeOf(c) === 'other' ? 'Class' : s.label} focus`, s.color, `${fmt(upstream.length)} callers · ${paths.length} entry points`));
            if (slice.truncated) nodes.push(el('div', 'note', `Large caller tree: showing the nearest ${fmt(SLICE_LIMIT)} methods.`));

            const target = el('div', 'target');
            target.append(el('div', 'sig', classId !== undefined ? G.classNames[c] : qualifiedLabel(m)), el('div', 'fqn', classFqn(c)));
            nodes.push(block(classId !== undefined ? 'Target class' : 'Target method', null, target));

            const grid = el('div', 'grid2');
            const state = beanState(c);
            grid.append(
                stat('Bean state', state === 'active' ? 'Active' : state === 'inactive' ? 'Switched off' : 'Conditional',
                    state === 'active' ? '#34d399' : state === 'inactive' ? '#94a3b8' : '#fbbf24'),
                stat('Type', classKind(c) + (classId === undefined && isAbstract(m) ? ' · abstract' : '')),
                stat('Entry point', classId === undefined && isEntry(m) ? ENTRY_LABELS[entryKind(m)] : '—', classId === undefined && isEntry(m) ? '#fb7185' : null),
                stat('Profile', G.manifest.profiles.join(', '), '#67e8f9'));
            nodes.push(block('Spring diagnostics', null, grid));

            nodes.push(block('Upstream trace trees', `${paths.length} active root${paths.length === 1 ? '' : 's'}`,
                paths.length ? traceCards(paths, rootSet)
                    : el('div', 'empty', 'No entry point reaches this. It may be unused, or called via reflection, events, or a JDK/library interface (Runnable, Function…) Marga does not follow.')));

            // polymorphism: implementations of an abstract target, or what a concrete target implements
            const decls = classId === undefined ? declarationsOf(m) : [];
            if (impls.length || decls.length || targets.some(isAbstract)) {
                const list = el('div', 'list');
                impls.forEach(i => list.appendChild(polyRow(i, 'implementation')));
                decls.forEach(d => list.appendChild(polyRow(d, 'implements')));
                if (!impls.length && targets.some(isAbstract)) {
                    list.appendChild(el('div', 'empty', showInactive ? 'No implementation in the scanned code (e.g. a Spring Data proxy).'
                        : 'No active implementation. Turn on "Show beans switched off by the profile".'));
                }
                nodes.push(block('Polymorphism & implementations', null, list));
            }
            if (upstream.length) nodes.push(block('Callers', null, upstreamDetails(upstream)));
            nodes.push(block('Edge call semantics', null, edgeLegend()));

            copyText = stackText(classId !== undefined ? classFqn(c) : `${qualifiedLabel(m)}  [${classFqn(c)}]`, paths);
            openDrawer(nodes, [copyButton()]);
        }

        function polyRow(m, relation) {
            const c = classOf(m);
            const row = el('button', 'row');
            row.type = 'button';
            const dot = el('span', 'dot');
            dot.style.background = beanState(c) === 'inactive' ? '#475569' : stereo(c).color;
            dot.style.boxShadow = `0 0 8px ${dot.style.background}`;
            const text = el('span');
            text.style.minWidth = '0';
            text.append(el('div', 'label', qualifiedLabel(m)), el('div', 'sub', relation === 'implements' ? 'implemented here' : classFqn(c)));
            row.append(dot, text, stateTag(c));
            row.addEventListener('click', () => selectMethods([m]));
            return row;
        }

        const selectClass = c => selectMethods(classMethods(c), c);

        // ================================================================ impact view
        // Its own page, only when a diff was analyzed: KPI cards, a class-level graph
        // (changed classes -> classes holding the affected entry points), a QA checklist and the changes.
        let view = 'explorer';
        const IMP = { built: false, tab: 'graph', focus: null, filter: 'all', cy: null, d: null, checked: new Set() };

        function setView(v) {
            if (!G.impact) v = 'explorer';
            if (v === view) return;
            view = v;
            document.body.classList.toggle('view-impact', v === 'impact');
            document.querySelectorAll('#rail button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
            if (v === 'impact') {
                closeResults();
                if (IMP.cy) requestAnimationFrame(() => { IMP.cy.resize(); });
            }
        }
        document.querySelectorAll('#rail button').forEach(b => b.addEventListener('click', () => {
            if (b.dataset.view === 'impact') showImpact();
            else { setView('explorer'); if (location.hash === '#impact') setRoute(''); }
        }));

        async function showImpact(replaceRoute = false) {
            setRoute('impact', replaceRoute);
            setView('impact');
            if (!IMP.built) await buildImpact();
        }

        // ---------- derived data
        function deriveImpact() {
            const I = G.impact;
            const D = {};
            D.changed = I.changed;
            D.byId = new Map(I.changed.map(c => [c.m, c]));
            D.entries = I.entries || [];
            D.entries.forEach(e => { e.reachedList = e.reached && e.reached.length ? e.reached : [e.near]; });
            D.direct = D.entries.filter(e => e.edited);
            D.indirect = D.entries.filter(e => !e.edited);
            D.newIds = new Set(I.changed.filter(c => c.added).map(c => c.m));
            D.wideMin = Math.max(5, Math.ceil(D.entries.length * 0.3));
            D.risk = reach => reach >= D.wideMin ? 'wide' : reach <= 1 ? 'narrow' : 'medium';

            D.changedClasses = new Map();
            I.changed.forEach(c => {
                const k = classOf(c.m);
                if (!D.changedClasses.has(k)) D.changedClasses.set(k, { cls: k, changes: [], entries: new Set() });
                D.changedClasses.get(k).changes.push(c);
            });
            D.entries.forEach(e => e.reachedList.forEach(m => {
                const info = D.changedClasses.get(classOf(m));
                if (info) info.entries.add(e.m);
            }));
            D.changedClasses.forEach(info => {
                info.reach = info.entries.size;
                info.model = info.changes.every(c => c.model);
                info.config = info.changes.some(c => c.config);
            });
            D.entryClasses = new Map();
            D.entries.forEach(e => {
                const k = classOf(e.m);
                if (!D.entryClasses.has(k)) D.entryClasses.set(k, { cls: k, entries: [] });
                D.entryClasses.get(k).entries.push(e);
            });
            D.widest = I.changed.filter(c => !c.model && c.reach > 0).sort((a, b) => b.reach - a.reach)[0];
            D.widestClass = [...D.changedClasses.values()].filter(i => !i.model && i.reach > 0).sort((a, b) => b.reach - a.reach)[0];
            return D;
        }

        /** Walk over callers from one changed class: call depth and next hop towards it, for every caller. */
        function classWalk(info) {
            if (info.walk) return info.walk;
            const depth = new Map(), next = new Map(), queue = [];
            info.changes.forEach(c => { depth.set(c.m, 0); queue.push(c.m); });
            for (let h = 0; h < queue.length; h++) {
                const m = queue[h];
                for (let e = G.revOffsets[m]; e < G.revOffsets[m + 1]; e++) {
                    const caller = G.revSources[e];
                    if (!depth.has(caller)) { depth.set(caller, depth.get(m) + 1); next.set(caller, m); queue.push(caller); }
                }
            }
            return (info.walk = { depth, next });
        }

        // ---------- labels
        const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many}`;
        function routeNode(m) {
            const route = G.entryRoutes[m];
            const span = el('span', 'lbl');
            if (route && /^[A-Z|]+ /.test(route)) {
                const [verb, ...rest] = route.split(' ');
                const v = el('span', 'verb ' + (/^(GET|POST|PUT|PATCH|DELETE)$/.test(verb) ? verb.toLowerCase() : 'other'), verb);
                span.append(v, document.createTextNode(rest.join(' ')));
            } else {
                span.textContent = route || qualifiedLabel(m);
            }
            span.title = `${route ? route + ' — ' : ''}${qualifiedLabel(m)}`;
            return span;
        }
        const mini = (cls, text) => el('span', 'mini ' + cls, text);
        function span(lines) {
            if (!lines.length) return 'anonymous class';
            const a = Math.min(...lines), b = Math.max(...lines);
            return a === b ? `:${a}` : `:${a}-${b}`;
        }
        const fileName = path => path.split('/').pop();

        // ---------- page
        async function buildImpact() {
            IMP.d = deriveImpact();
            const D = IMP.d;
            await ensureSignatures([...D.changed.map(c => c.m), ...D.entries.map(e => e.m), ...D.entries.map(e => e.near)]);
            IMP.built = true;
            if (D.widestClass) IMP.focus = D.widestClass.cls;
            renderImpact();
        }

        function renderImpact() {
            const D = IMP.d, I = G.impact;
            const page = $('impact');
            page.replaceChildren();

            // header: breadcrumb + tabs
            const head = el('div', 'imp-head');
            const crumb = el('div', 'crumb');
            crumb.append(el('b', null, 'Change impact'), el('span', null, '·'), el('span', null, `vs ${I.base}`),
                el('span', 'tagx', `profile: ${G.manifest.profiles.join(', ')}`));
            const tabs = el('div', 'tabs');
            [['graph', 'Graph'], ['qa', `QA checklist (${D.entries.length})`], ['changes', `Changes (${D.changedClasses.size} classes)`]]
                .forEach(([id, text]) => {
                    const b = el('button', IMP.tab === id ? 'on' : null, text);
                    b.type = 'button';
                    b.addEventListener('click', () => { IMP.tab = id; renderImpact(); });
                    tabs.appendChild(b);
                });
            head.append(crumb, tabs);
            page.appendChild(head);

            // configuration warning
            const config = D.changed.filter(c => c.config);
            if (config.length) {
                const b = el('div', 'banner');
                b.append(el('span', null, '⚠️'), el('span', null,
                    `Configuration changed: ${config.map(c => qualifiedLabel(c.m)).join(', ')}. It can affect every endpoint ` +
                    '(security, serialization, data sources…), so smoke-test the application broadly, not only the entry points listed here.'));
                page.appendChild(b);
            }

            // KPI cards
            const kpis = el('div', 'kpis');
            const card = (title, big, unit, foot) => {
                const k = el('div', 'kpi glass');
                const b = el('div', 'big', fmt(big));
                b.appendChild(el('small', null, unit));
                k.append(el('div', 'eyebrow', title), b, el('div', 'foot2', foot));
                return k;
            };
            kpis.appendChild(card('Changed methods', D.changed.length, 'methods changed',
                `across ${plural(D.changedClasses.size, 'class', 'classes')}` + (D.newIds.size ? ` · ${D.newIds.size} new` : '')));
            kpis.appendChild(card('Affected entry points', D.entries.length, 'entry points',
                `${D.direct.length} edited directly · ${D.indirect.length} through dependencies`));
            const hot = el('div', 'kpi hot');
            hot.appendChild(el('div', 'eyebrow', 'Widest change'));
            if (D.widest) {
                hot.append(el('div', 'method', qualifiedLabel(D.widest.m)),
                    el('div', 'foot2', `reaches ${plural(D.widest.reach, 'entry point', 'entry points')}`));
                hot.title = 'Show in the graph';
                hot.addEventListener('click', () => { IMP.tab = 'graph'; IMP.focus = classOf(D.widest.m); renderImpact(); });
            } else {
                hot.append(el('div', 'method', '—'), el('div', 'foot2', 'no change reaches an entry point'));
            }
            kpis.appendChild(hot);
            const um = I.unmapped;
            kpis.appendChild(card('Not mapped', um.length, 'files & lines',
                um.length ? [...new Set(um.map(u => fileName(u.file)))].slice(0, 3).join(', ') + (um.length > 3 ? '…' : '') : 'everything mapped to methods'));
            page.appendChild(kpis);

            if (IMP.tab === 'graph') renderGraphTab(page);
            else if (IMP.tab === 'qa') renderQaTab(page);
            else renderChangesTab(page);
        }

        // ---------- graph tab
        function renderGraphTab(page) {
            const D = IMP.d;
            const body = el('div', 'imp-body');
            const box = el('div', 'graphbox glass');
            const bar = el('div', 'toolbar');
            const risk = [['all', 'All', null], ['wide', `Wide (≥${D.wideMin})`, '#ef4444'], ['medium', 'Medium', '#22d3ee'], ['narrow', 'Narrow (≤1)', '#10b981']];
            risk.forEach(([id, text, color]) => {
                const b = el('button', 'chipbtn' + (IMP.focus == null && IMP.filter === id ? ' on' : ''));
                b.type = 'button';
                if (color) { const d = el('span', 'd'); d.style.background = color; b.appendChild(d); }
                b.appendChild(document.createTextNode(text));
                b.addEventListener('click', () => { IMP.filter = id; IMP.focus = null; renderImpact(); });
                bar.appendChild(b);
            });
            bar.appendChild(el('span', 'grow'));
            if (IMP.focus != null) bar.appendChild(el('span', 'origin', `● Focus: ${G.classNames[IMP.focus]}`));
            const fit = el('button', 'chipbtn', '⤢ Fit');
            fit.type = 'button';
            fit.addEventListener('click', () => IMP.cy && IMP.cy.animate({ fit: { padding: 40 }, duration: 300 }));
            bar.appendChild(fit);
            const holder = el('div');
            holder.id = 'impact-cy';
            box.append(bar, holder);
            const detail = el('aside', 'detail glass');
            body.append(box, detail);
            page.appendChild(body);

            if (IMP.cy) IMP.cy.destroy();
            IMP.cy = cytoscape({
                container: holder, minZoom: 0.15, maxZoom: 2.5,
                style: [
                    { selector: 'node', style: {
                            'shape': 'round-rectangle', 'width': 'data(nw)', 'height': 'data(nh)',
                            'background-color': '#0b1628', 'border-width': 1.5, 'border-color': 'data(color)',
                            'label': 'data(label)', 'text-wrap': 'wrap', 'text-valign': 'center', 'text-halign': 'center',
                            'color': '#e2e8f0', 'font-family': 'JetBrains Mono, ui-monospace, Consolas, monospace', 'font-size': 11, 'line-height': 1.35 }},
                    { selector: 'node[?changed]', style: { 'border-color': '#f59e0b', 'background-color': '#1f1405' } },
                    { selector: 'node[risk="wide"]', style: { 'border-color': '#ef4444', 'background-color': '#4c0d0d',
                            'underlay-color': '#ef4444', 'underlay-opacity': 0.18, 'underlay-padding': 8 } },
                    { selector: 'node.sel', style: { 'border-width': 3, 'border-color': '#f8fafc' } },
                    { selector: 'edge', style: {
                            'curve-style': 'bezier', 'width': 'data(w)', 'line-color': '#4b5b73', 'target-arrow-shape': 'triangle',
                            'target-arrow-color': '#4b5b73', 'arrow-scale': 0.8, 'label': 'data(label)',
                            'font-family': 'JetBrains Mono, ui-monospace, Consolas, monospace', 'font-size': 10, 'color': '#cbd5e1',
                            'text-background-color': '#030a14', 'text-background-opacity': 0.9, 'text-background-padding': 3,
                            'text-background-shape': 'roundrectangle' }},
                    { selector: 'edge.hl', style: { 'line-color': '#22d3ee', 'target-arrow-color': '#22d3ee', 'color': '#e0f2fe' } },
                    { selector: '.dim', style: { 'opacity': 0.25 } }
                ]
            });
            IMP.cy.add(impactElements());
            IMP.cy.fit(undefined, 40);
            IMP.cy.on('tap', 'node', evt => {
                const n = evt.target;
                if (n.data('changed') && IMP.focus !== n.data('cls')) { IMP.focus = n.data('cls'); renderImpact(); return; }
                selectImpactNode(n.data('cls'), detail);
            });
            IMP.cy.on('mouseover', 'node', () => { holder.style.cursor = 'pointer'; });
            IMP.cy.on('mouseout', 'node', () => { holder.style.cursor = ''; });

            if (IMP.focus != null) selectImpactNode(IMP.focus, detail);
            else detailHint(detail);
        }

        /** Changed classes and the classes holding the entry points they reach, one edge per pair. */
        function impactElements() {
            const D = IMP.d;
            const nodes = new Map(), edges = [];
            const node = cls => {
                if (!nodes.has(cls)) nodes.set(cls, { cls, changed: false, entryCount: 0 });
                return nodes.get(cls);
            };
            const sources = IMP.focus != null
                ? [D.changedClasses.get(IMP.focus)].filter(Boolean)
                : [...D.changedClasses.values()].filter(i => i.reach > 0 && !i.model && (IMP.filter === 'all' || D.risk(i.reach) === IMP.filter));
            sources.forEach(info => {
                node(info.cls).changed = true;
                const walk = classWalk(info);
                const byClass = new Map();
                info.entries.forEach(m => {
                    const k = classOf(m), d = walk.depth.get(m) ?? 0;
                    const cur = byClass.get(k) || { count: 0, hops: Infinity };
                    cur.count++; cur.hops = Math.min(cur.hops, d);
                    byClass.set(k, cur);
                });
                byClass.forEach((v, k) => {
                    node(k).entryCount = (D.entryClasses.get(k) || { entries: [] }).entries.length;
                    if (k !== info.cls) edges.push({ from: info.cls, to: k, ...v });
                });
            });

            // layout: focus = hub and spokes; overview = changed classes left, entry classes right
            const list = [...nodes.values()];
            const pos = new Map();
            if (IMP.focus != null) {
                const others = list.filter(n => n.cls !== IMP.focus).sort((a, b) => b.entryCount - a.entryCount);
                pos.set(IMP.focus, { x: 0, y: 0 });
                const r = Math.max(230, others.length * 34);
                others.forEach((n, i) => {
                    const a = (i / Math.max(1, others.length)) * Math.PI * 2 - Math.PI / 2;
                    pos.set(n.cls, { x: r * Math.cos(a) * 1.35, y: r * Math.sin(a) });
                });
            } else {
                // classes holding entry points on the right (even when they changed too), the rest on the left
                const left = list.filter(n => n.changed && !n.entryCount).sort((a, b) => (D.changedClasses.get(b.cls).reach - D.changedClasses.get(a.cls).reach));
                const right = list.filter(n => n.entryCount).sort((a, b) => (b.changed - a.changed) || (b.entryCount - a.entryCount));
                left.forEach((n, i) => pos.set(n.cls, { x: 0, y: (i - (left.length - 1) / 2) * 78 }));
                right.forEach((n, i) => pos.set(n.cls, { x: 620, y: (i - (right.length - 1) / 2) * 64 }));
            }

            const els = list.map(n => {
                const info = D.changedClasses.get(n.cls);
                const lines = [G.classNames[n.cls]];
                if (n.changed) lines.push(`${plural(info.changes.length, 'change', 'changes')} · ${plural(info.reach, 'entry point', 'entry points')}`);
                else lines.push(`(${plural(n.entryCount, 'entry point', 'entry points')})`);
                const widest = Math.max(...lines.map(l => l.length));
                return { group: 'nodes', position: pos.get(n.cls), data: {
                        id: 'n' + n.cls, cls: n.cls, label: lines.join('\n'), changed: n.changed,
                        nw: Math.round(widest * 6.9 + 26), nh: lines.length * 15 + 18,
                        risk: n.changed ? D.risk(info.reach) : '', color: stereo(n.cls).color } };
            });
            edges.forEach((e, i) => els.push({ group: 'edges', data: {
                    id: 'x' + i, source: 'n' + e.from, target: 'n' + e.to,
                    w: Math.min(5, 1 + Math.log2(e.count + 1)),
                    label: `${plural(e.count, 'route', 'routes')} · ${e.hops === Infinity ? '?' : plural(e.hops, 'hop', 'hops')}` } }));
            return els;
        }

        function detailHint(detail) {
            detail.replaceChildren(el('div', 'eyebrow', 'Details'),
                el('p', 'muted', 'Click a changed class (amber, red when its reach is wide) to focus on it, or a class with entry points to see which of them are affected.'));
        }

        function selectImpactNode(cls, detail) {
            const D = IMP.d;
            IMP.cy.nodes().removeClass('sel');
            IMP.cy.edges().removeClass('hl');
            const node = IMP.cy.getElementById('n' + cls);
            node.addClass('sel');
            node.connectedEdges().addClass('hl');
            const info = D.changedClasses.get(cls);
            if (info && (info.reach > 0 || !D.entryClasses.has(cls))) changedClassDetail(info, detail);
            else entryClassDetail(D.entryClasses.get(cls), detail);
        }

        function detailHead(detail, cls, tags) {
            const s = stereo(cls);
            const top = el('div', 'drawer-head');
            const chip = el('span', 'chip', stereotypeOf(cls) === 'other' ? 'Class' : '@' + s.label);
            chip.style.color = s.color; chip.style.borderColor = s.color + '66'; chip.style.background = s.color + '14';
            top.append(chip, ...tags);
            detail.append(top, el('h3', null, G.classNames[cls]), el('div', 'path', classFqn(cls)));
        }

        function changedClassDetail(info, detail) {
            const D = IMP.d;
            const walk = classWalk(info);
            detail.replaceChildren();
            const r = D.risk(info.reach);
            detailHead(detail, info.cls, [
                mini(r === 'wide' ? 'wide' : '', r === 'wide' ? '🔥 Wide reach' : r === 'medium' ? 'Medium reach' : 'Narrow reach'),
                ...(info.config ? [mini('cfg', 'Configuration')] : [])]);
            const entries = [...info.entries].sort((a, b) => (walk.depth.get(a) ?? 0) - (walk.depth.get(b) ?? 0));
            const maxHops = entries.reduce((mx, m) => Math.max(mx, walk.depth.get(m) ?? 0), 0);
            const trio = el('div', 'trio');
            [[info.reach, 'Entry points'], [info.changes.length, 'Methods changed'], [maxHops, 'Max hops']].forEach(([v, l], i) => {
                const b = el('b', null, fmt(v));
                if (i === 0) b.style.color = r === 'wide' ? '#f87171' : '#22d3ee';
                const d = el('div'); d.append(b, el('span', null, l)); trio.appendChild(d);
            });
            detail.appendChild(trio);

            const sigs = el('div');
            info.changes.forEach(c => {
                const row = el('div', 'sigrow');
                const lbl = el('span', 'lbl', methodLabel(c.m));
                lbl.title = `${c.file}${span(c.lines)}`;
                row.append(lbl);
                if (c.added) row.appendChild(mini('new', '🆕 new'));
                if (c.model) row.appendChild(mini('', 'model'));
                row.appendChild(el('span', 'ln', span(c.lines)));
                sigs.appendChild(row);
            });
            detail.appendChild(block('Modified signatures', `${info.changes.length}`, sigs));

            if (entries.length) {
                const list = el('div');
                entries.slice(0, 200).forEach(m => {
                    const row = el('button', 'eprow');
                    row.type = 'button';
                    row.title = 'Trace in the explorer';
                    row.append(routeNode(m), el('span', 'hops', plural(walk.depth.get(m) ?? 0, 'hop', 'hops')));
                    row.addEventListener('click', () => selectMethods([m]));
                    list.appendChild(row);
                });
                detail.appendChild(block('Entry points reached', `${entries.length} routes`, list));

                const deepest = entries[entries.length - 1];
                const path = [deepest];
                for (let cur = deepest; walk.next.has(cur); cur = walk.next.get(cur)) path.push(walk.next.get(cur));
                const classes = [];
                path.forEach(m => { const n = G.classNames[classOf(m)]; if (classes[classes.length - 1] !== n) classes.push(n); });
                const chain = el('div', 'chain', `${G.entryRoutes[deepest] || qualifiedLabel(deepest)} → ${classes.join(' → ')}`);
                detail.appendChild(block('Deepest call chain', `${plural(path.length - 1, 'hop', 'hops')}`, chain));
            } else {
                detail.appendChild(el('div', 'empty', info.config ? 'Configuration: not called by any entry point, but it can affect all of them.'
                    : info.model ? 'Model methods called by frameworks (JSON or database mapping).' : 'No entry point reaches these changes.'));
            }
            const open = el('button', 'cta', 'Trace in explorer');
            open.type = 'button';
            open.style.marginTop = '8px';
            open.addEventListener('click', () => selectMethods(info.changes.map(c => c.m)));
            detail.appendChild(open);
        }

        function entryClassDetail(info, detail) {
            const D = IMP.d;
            detail.replaceChildren();
            const edited = info.entries.filter(e => e.edited).length;
            const fresh = info.entries.filter(e => e.edited && D.newIds.has(e.m)).length;
            detailHead(detail, info.cls, [mini('', 'Entry points')]);
            const trio = el('div', 'trio');
            [[info.entries.length, 'Affected'], [edited, 'Edited directly'], [fresh, 'New']].forEach(([v, l]) => {
                const d = el('div'); d.append(el('b', null, fmt(v)), el('span', null, l)); trio.appendChild(d);
            });
            detail.appendChild(trio);
            const list = el('div');
            info.entries.slice().sort((a, b) => a.hops - b.hops).forEach(e => {
                const row = el('button', 'eprow');
                row.type = 'button';
                row.append(routeNode(e.m));
                if (e.edited && D.newIds.has(e.m)) row.appendChild(mini('new', '🆕 new'));
                if (!e.certain) row.appendChild(mini('may', 'may call'));
                row.appendChild(el('span', 'hops', e.edited ? 'edited' : `via ${qualifiedLabel(e.near)} · ${plural(e.hops, 'hop', 'hops')}`));
                row.addEventListener('click', () => selectMethods([e.m]));
                list.appendChild(row);
            });
            detail.appendChild(block('Affected entry points', null, list));
        }

        // ---------- QA checklist tab (same logic as impact.md)
        const KIND_ORDER = ['http', 'kafka', 'rabbit', 'jms', 'sqs', 'scheduled', 'event', ''];
        const KIND_TITLES = { http: 'HTTP endpoints', kafka: 'Kafka consumers', rabbit: 'RabbitMQ listeners', jms: 'JMS listeners',
            sqs: 'SQS listeners', scheduled: 'Scheduled jobs', event: 'Event listeners', '': 'Other entry points' };

        function minimalTestSet(entries) {
            const left = new Set();
            entries.forEach(e => e.reachedList.forEach(m => left.add(m)));
            const picks = [];
            while (left.size) {
                let best = null, bestCover = [];
                for (const e of entries) {
                    const cover = e.reachedList.filter(m => left.has(m));
                    if (!cover.length) continue;
                    const better = cover.length > bestCover.length || cover.length === bestCover.length
                        && (e.certain && !best.certain || e.certain === best.certain && e.hops < best.hops);
                    if (better) { best = e; bestCover = cover; }
                }
                if (!best) break;
                picks.push({ e: best, covers: bestCover });
                bestCover.forEach(m => left.delete(m));
            }
            return picks;
        }

        function checkRow(e, why) {
            const D = IMP.d;
            const row = el('label', 'check' + (IMP.checked.has(e.m) ? ' done' : ''));
            const box = el('input');
            box.type = 'checkbox';
            box.checked = IMP.checked.has(e.m);
            box.addEventListener('change', () => {
                if (box.checked) IMP.checked.add(e.m); else IMP.checked.delete(e.m);
                row.classList.toggle('done', box.checked);
            });
            row.append(box, routeNode(e.m));
            if (e.edited && D.newIds.has(e.m)) row.appendChild(mini('new', '🆕 new'));
            if (!e.certain) row.appendChild(mini('may', 'may call'));
            if (why) row.appendChild(el('span', 'why', why));
            return row;
        }

        function groupedChecklist(parent, entries, withReason) {
            const byKind = new Map(KIND_ORDER.map(k => [k, []]));
            entries.forEach(e => byKind.get(entryKind(e.m)).push(e));
            byKind.forEach((list, kind) => {
                if (!list.length) return;
                parent.appendChild(el('h4', null, `${KIND_TITLES[kind]} (${list.length})`));
                const byClass = new Map();
                list.forEach(e => { const k = classOf(e.m); if (!byClass.has(k)) byClass.set(k, []); byClass.get(k).push(e); });
                [...byClass.entries()].sort((a, b) => G.classNames[a[0]].localeCompare(G.classNames[b[0]])).forEach(([cls, items]) => {
                    parent.appendChild(el('div', 'clsname', G.classNames[cls]));
                    items.sort((a, b) => String(G.entryRoutes[a.m]).localeCompare(String(G.entryRoutes[b.m]))).forEach(e => {
                        const why = withReason
                            ? `via ${qualifiedLabel(e.near)} · ${plural(e.hops, 'hop', 'hops')}${e.changes > 1 ? ` (+${e.changes - 1} more)` : ''}`
                            : methodLabel(e.m);
                        parent.appendChild(checkRow(e, why));
                    });
                });
            });
        }

        function renderQaTab(page) {
            const D = IMP.d;
            const wrap = el('div', 'qa');
            page.appendChild(wrap);

            // minimal test set
            const picks = minimalTestSet(D.entries);
            const covered = picks.reduce((n, p) => n + p.covers.length, 0);
            const setCard = el('div', 'card glass');
            setCard.append(el('h2', null, 'Minimal test set'),
                el('div', 'sub', `Testing these ${plural(picks.length, 'entry point', 'entry points')} exercises all ${plural(covered, 'changed method', 'changed methods')} that any entry point reaches.`));
            picks.forEach(p => setCard.appendChild(checkRow(p.e, `covers ${plural(p.covers.length, 'change', 'changes')}`)));
            const unreached = D.changed.filter(c => c.reach === 0);
            if (unreached.length) {
                setCard.appendChild(el('h4', null, `Not reached by any entry point (${unreached.length})`));
                const groups = [
                    [unreached.filter(c => c.config), 'Configuration: runs at startup and may affect every endpoint; smoke-test broadly'],
                    [unreached.filter(c => !c.config && c.model), 'Model methods called by frameworks (JSON or database mapping)'],
                    [unreached.filter(c => !c.config && !c.model), 'No caller found: check with unit tests']];
                groups.forEach(([list, title]) => {
                    if (!list.length) return;
                    setCard.appendChild(el('div', 'callout', `${title}: ${list.map(c => qualifiedLabel(c.m)).join(', ')}`));
                });
            }
            const copy = el('button', 'ghostbtn', '⧉ Copy checklist as Markdown');
            copy.type = 'button';
            copy.style.marginTop = '12px';
            copy.addEventListener('click', async () => {
                const text = checklistMarkdown(picks);
                try { await navigator.clipboard.writeText(text); } catch (e) {
                    const ta = el('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
                }
                copy.textContent = '✔ Copied';
                setTimeout(() => { copy.textContent = '⧉ Copy checklist as Markdown'; }, 1500);
            });
            setCard.appendChild(copy);
            wrap.appendChild(setCard);

            // through dependencies, with the dominant shared change folded
            const dep = el('div', 'card glass');
            dep.append(el('h2', null, `Affected through dependencies (${D.indirect.length})`),
                el('div', 'sub', 'The entry points most easily missed in testing: their own code did not change.'));
            const onlyVia = new Map();
            D.indirect.filter(e => e.changes === 1).forEach(e => {
                if (!onlyVia.has(e.near)) onlyVia.set(e.near, []);
                onlyVia.get(e.near).push(e);
            });
            const dominant = [...onlyVia.entries()].sort((a, b) => b[1].length - a[1].length)[0];
            if (dominant && dominant[1].length >= 5 && dominant[1].length >= D.indirect.length * 0.4) {
                const folded = new Set(dominant[1]);
                dep.appendChild(el('div', 'callout', `${dominant[1].length} of ${D.indirect.length} are reached only through ` +
                    `${qualifiedLabel(dominant[0])}. They exercise the same changed code, so a few of them (see the minimal test set) cover that change.`));
                groupedChecklist(dep, D.indirect.filter(e => !folded.has(e)), true);
                const det = el('details');
                det.appendChild(el('summary', null, `${plural(folded.size, 'entry point', 'entry points')} reached only through ${qualifiedLabel(dominant[0])}`));
                groupedChecklist(det, [...folded], true);
                dep.appendChild(det);
            } else if (D.indirect.length) {
                groupedChecklist(dep, D.indirect, true);
            } else {
                dep.appendChild(el('div', 'empty', 'None: every affected entry point was edited directly.'));
            }
            wrap.appendChild(dep);

            const dir = el('div', 'card glass');
            dir.append(el('h2', null, `Edited directly (${D.direct.length})`), el('div', 'sub', 'Entry points whose own code changed.'));
            if (D.direct.length) groupedChecklist(dir, D.direct, false);
            wrap.appendChild(dir);
        }

        function checklistMarkdown(picks) {
            const D = IMP.d;
            const line = (e, extra) => `- [${IMP.checked.has(e.m) ? 'x' : ' '}] ${G.entryRoutes[e.m] ? '`' + G.entryRoutes[e.m] + '` — ' : ''}` +
                `\`${qualifiedLabel(e.m)}\`${e.edited && D.newIds.has(e.m) ? ' · 🆕 new' : ''}${extra || ''}${e.certain ? '' : ' · ⚠️ may call'}`;
            const out = [`## QA checklist (vs ${G.impact.base})`, '', '### Minimal test set', ''];
            picks.forEach(p => out.push(line(p.e, ` · covers ${plural(p.covers.length, 'change', 'changes')}`)));
            out.push('', `### Affected through dependencies (${D.indirect.length})`, '');
            D.indirect.forEach(e => out.push(line(e, ` · via \`${qualifiedLabel(e.near)}\`, ${plural(e.hops, 'hop', 'hops')}`)));
            out.push('', `### Edited directly (${D.direct.length})`, '');
            D.direct.forEach(e => out.push(line(e)));
            return out.join('\n');
        }

        // ---------- changes tab
        function renderChangesTab(page) {
            const D = IMP.d, I = G.impact;
            const wrap = el('div', 'qa');
            page.appendChild(wrap);
            const infos = [...D.changedClasses.values()].sort((a, b) => (a.model - b.model) || (b.reach - a.reach));
            infos.forEach(info => {
                const card = el('div', 'clscard glass');
                const top = el('div', 'top');
                const dot = el('span', 'dot');
                dot.style.cssText = `width:9px;height:9px;border-radius:50%;background:${stereo(info.cls).color}`;
                top.append(dot, el('b', null, G.classNames[info.cls]));
                if (info.reach >= D.wideMin) top.appendChild(mini('wide', '🔥 wide'));
                if (info.config) top.appendChild(mini('cfg', 'configuration'));
                if (info.model) top.appendChild(mini('', 'model'));
                top.appendChild(el('span', 'meta', `${plural(info.changes.length, 'method', 'methods')} · reaches ${plural(info.reach, 'entry point', 'entry points')}`));
                card.appendChild(top);
                card.appendChild(el('div', 'path', info.changes[0].file));
                info.changes.slice().sort((a, b) => b.reach - a.reach).forEach(c => {
                    const row = el('button', 'eprow');

                    row.append(el('span', 'lbl', methodLabel(c.m)));
                    if (c.added) row.appendChild(mini('new', '🆕 new'));
                    row.appendChild(el('span', 'hops', `${span(c.lines)} · ${c.reach < 0 ? '–' : plural(c.reach, 'entry point', 'entry points')}`));
                    row.addEventListener('click', () => { IMP.tab = 'graph'; IMP.focus = info.cls; renderImpact(); });

            });
            if (I.unmapped.length) {
                const card = el('div', 'card glass');

                    el('div', 'sub', 'Check these by hand: configuration and resources can change behavior without touching Java code.'));
                I.unmapped.forEach(u => {
                    const row = el('div', 'sigrow');
                    row.append(el('span', 'lbl', `${u.file}${u.lines.length ? ':' + u.lines.join(', ') : ''}`), el('span', 'ln', u.reason));
                    card.appendChild(row);
                });
                wrap.appendChild(card);
            }
        }

        window.addEventListener('resize', () => { if (IMP.cy && view === 'impact') IMP.cy.resize(); });

        function reset() {
            setView('explorer');
            closeResults();
            lastSelection = null;
            setRoute('');
            closeDrawer();
            if (fullMode) {
                cy.elements().removeClass('faded hl focus dim-trace');
                fitVisible(cy.elements(), false, 40);
            } else {
                cy.elements().remove();
                idleHint();
            }
        }

        function idleHint() {
            showHint('Trace any method to its entry points',
                `${fmt(G.M)} methods are too many to draw at once. Press <span class="kbd">Ctrl K</span> and search for a class or method.`);
        }

        // ================================================================ search
        let hits = [], active = -1, searchTimer;

        function search(raw) {
            const q = raw.trim().toLowerCase();
            if (!q) return { classes: [], methods: [] };
            if (!G.classFqnLower) G.classFqnLower = G.classNames.map((_, c) => classFqn(c).toLowerCase());
            const dot = q.lastIndexOf('.');
            const classQuery = dot > 0 ? q.slice(0, dot) : null;
            const methodQuery = dot > 0 ? q.slice(dot + 1) : q;
            const exactClass = c => G.classNames[c].toLowerCase() === classQuery || G.classFqnLower[c] === classQuery;
            const hasExactClass = classQuery && G.classNames.some((_, c) => exactClass(c));
            const classMatches = c => !classQuery || (hasExactClass ? exactClass(c) : G.classFqnLower[c].includes(classQuery));

            const classes = [];
            if (!classQuery) for (let c = 0; c < G.C && classes.length < 12; c++) if (G.classFqnLower[c].includes(q)) classes.push(c);
            let methods = [];
            for (let c = 0; c < G.C && methods.length < 60; c++) {
                if (!classMatches(c)) continue;
                for (let m = G.classMethodOffsets[c]; m < G.classMethodOffsets[c + 1] && methods.length < 60; m++) {
                    if (!methodQuery || G.namesLower[G.nameIdx[m]].includes(methodQuery)) methods.push(m);
                }
            }
            const exact = methods.filter(m => G.namesLower[G.nameIdx[m]] === methodQuery);
            if (exact.length) methods = [...exact, ...methods.filter(m => !exact.includes(m))];
            return { classes, methods };
        }

        async function renderResults(raw) {
            const { classes, methods } = search(raw);
            await ensureSignatures(methods);
            hits = [...classes.map(c => ({ c })), ...methods.map(m => ({ m }))];
            active = hits.length ? 0 : -1;
            results.replaceChildren();
            if (!raw.trim()) { closeResults(); return; }
            if (!hits.length) results.appendChild(el('div', 'empty', 'No matches'));
            const head = (text) => { const h = el('div', 'results-head'); h.appendChild(el('div', 'eyebrow', text)); results.appendChild(h); };
            if (classes.length) head('Classes');
            hits.forEach((h, i) => {
                if (i === classes.length && methods.length) head('Methods');
                const b = el('button', 'result' + (i === active ? ' active' : ''));
                b.type = 'button';
                if (h.c !== undefined) {
                    b.append(el('span', 'tag', classKind(h.c).split(' ')[0]), el('span', 'name', G.classNames[h.c]), el('span', 'where', G.packages[packageOf(h.c)]));
                } else {
                    const c = classOf(h.m);
                    const state = beanState(c);
                    b.append(el('span', 'tag', isEntry(h.m) ? 'entry' : isAbstract(h.m) ? 'abstract' : 'method'),
                        el('span', 'name', qualifiedLabel(h.m) + (state === 'active' ? '' : ` · ${state}`)), el('span', 'where', classFqn(c)));
                }
                b.addEventListener('mouseenter', () => setActive(i));
                b.addEventListener('click', () => choose(i));
                results.appendChild(b);
            });
            results.classList.add('open');
        }

        function setActive(i) {
            active = i;
            results.querySelectorAll('.result').forEach((b, j) => b.classList.toggle('active', j === i));
            const current = results.querySelectorAll('.result')[i];
            if (current) current.scrollIntoView({ block: 'nearest' });
        }
        function choose(i) {
            const h = hits[i];
            if (!h) return;
            searchBox.blur();
            if (h.c !== undefined) selectClass(h.c); else selectMethods([h.m]);
        }
        function closeResults() { results.classList.remove('open'); }

        searchBox.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => renderResults(searchBox.value), 120);
        });
        searchBox.addEventListener('focus', () => { if (searchBox.value.trim()) renderResults(searchBox.value); });
        searchBox.addEventListener('keydown', evt => {
            if (evt.key === 'ArrowDown') { evt.preventDefault(); if (hits.length) setActive((active + 1) % hits.length); }
            if (evt.key === 'ArrowUp') { evt.preventDefault(); if (hits.length) setActive((active - 1 + hits.length) % hits.length); }
            if (evt.key === 'Enter') { evt.preventDefault(); clearTimeout(searchTimer); if (!results.classList.contains('open')) renderResults(searchBox.value).then(() => choose(active)); else choose(active); }
            if (evt.key === 'Escape') { closeResults(); searchBox.blur(); }
        });
        document.addEventListener('keydown', evt => {
            if ((evt.key === 'k' || evt.key === 'K') && (evt.metaKey || evt.ctrlKey)) { evt.preventDefault(); searchBox.focus(); searchBox.select(); }
            else if (evt.key === '/' && document.activeElement !== searchBox) { evt.preventDefault(); searchBox.focus(); }
            else if (evt.key === 'Escape' && document.activeElement !== searchBox && view !== 'impact') reset();
        });
        document.addEventListener('click', evt => { if (!$('searchbox').contains(evt.target)) closeResults(); });
        if (/Mac|iPhone|iPad/.test(navigator.platform)) $('kbd-hint').textContent = '⌘K';

        // ================================================================ wiring
        cy.on('tap', evt => {
            const t = evt.target;
            closeResults();
            if (t === cy) { if (fullMode && lastSelection) reset(); return; }
            if (!t.isNode()) return;
            if (t.data('type') === 'module') { fitVisible(t, drawer.classList.contains('open'), 40); return; }
            if (t.data('type') === 'method') selectMethods([t.data('mid')]);
            else selectClass(t.data('cls'));
        });

        $('show-inactive').addEventListener('change', async evt => {
            showInactive = evt.target.checked;
            if (fullMode) {
                showHint('Laying out…', '');
                await draw(visibleMethods());
                hideHint();
            }
            if (lastSelection) selectMethods(...lastSelection);
            else if (G.impact && drawer.classList.contains('open')) showImpact();
        });
        const visibleMethods = () => { const ids = []; for (let m = 0; m < G.M; m++) if (methodShown(m)) ids.push(m); return ids; };

        function renderChrome() {
            const s = G.manifest.stats;
            const pills = $('pills');
            const pill = (cls, text) => { const p = el('span', 'pill ' + cls, text); pills.appendChild(p); return p; };
            pill('blue', `${fmt(s.classes)} Classes`);
            pill('emerald', `${fmt(s.methods)} Methods`);
            pill('purple', `${fmt(s.edges)} Calls`);
            pill('cyan', `${fmt(G.entryCount)} Entry points`);
            if (G.impact) {
                const p = pill('amber', `${fmt(G.impact.changed.length)} Changed`);
                p.insertAdjacentHTML('beforeend',
                    '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>');
                p.title = 'View change impact';
                p.setAttribute('role', 'button');
                p.tabIndex = 0;
                p.addEventListener('click', () => showImpact());
                p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showImpact(); } });
                document.body.classList.add('has-impact');
                $('rail-count').textContent = G.impact.changed.length;
            }
            const when = new Date(G.manifest.generatedAt);
            $('runmeta').textContent = `profile ${G.manifest.profiles.join(', ')} · ${isNaN(when) ? '' : when.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`;
            document.title = `Marga — ${fmt(s.classes)} classes · profile ${G.manifest.profiles.join(', ')}`;

            const legend = $('legend');
            Object.values(STEREOTYPES).forEach(st => {
                const i = el('i'); i.style.background = st.color; i.style.color = st.color;
                const span = el('span'); span.append(i, document.createTextNode(st.label)); legend.appendChild(span);
            });
            if (G.modules.length > 1) {
                const ring = el('i'); ring.style.cssText = 'background:transparent;border:1.5px dashed #38bdf8;box-shadow:none';
                const ms = el('span'); ms.append(ring, document.createTextNode('Module')); legend.appendChild(ms);
            }
            const entry = el('i', 'diamond'); entry.style.background = '#f43f5e'; entry.style.color = '#f43f5e';
            const es = el('span'); es.append(entry, document.createTextNode('Entry point')); legend.appendChild(es);
            if (G.impact) {
                const ring = el('i', 'ring');
                const rs = el('span'); rs.append(ring, document.createTextNode('Changed')); legend.appendChild(rs);
            }
        }

        async function start() {
            try {
                const manifest = await Marga.load('manifest');
                if (manifest.formatVersion !== FORMAT_VERSION) {
                    throw new Error(`report data format ${manifest.formatVersion} does not match viewer format ${FORMAT_VERSION}; re-run the plugin`);
                }
                const [core, searchData] = await Promise.all([Marga.load('core'), Marga.load('search')]);
                initModel(manifest, core, searchData);
                if (manifest.impact) {
                    G.impact = await Marga.load('impact');
                    G.impact.changedSet = new Set(G.impact.changed.map(c => c.m));
                }
                renderChrome();
                searchBox.disabled = false;
                fullMode = G.M <= FULL_RENDER_LIMIT;
                if (fullMode) {
                    showHint(`Laying out ${fmt(G.M)} methods…`, '');
                    await new Promise(r => setTimeout(r, 30)); // let the message paint
                    await draw(visibleMethods());
                    hideHint();
                } else {
                    idleHint();
                }
                if (location.hash) await applyRoute();              // deep link: #impact, #method=…, #class=…
                else if (G.impact) await showImpact(true);         // a diff was analyzed: open on its impact
            } catch (err) {
                showHint('Could not load the report', `${err.message}.<br>Keep index.html next to its data/ folder.`);
                console.error(err);
            }
        }
        start();
    })();
</script>
</body>
</html>
